<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player BUST Animation Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; font-family: Georgia, serif; background: #1e1610; color: #e9e0c6; }

    /* ── Control bar ── */
    #controls {
      background: #1e1610;
      border-bottom: 2px solid #3a2a1a;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    #controls .label { font-family: 'Playfair Display', Georgia, serif; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #d49848; margin-right: 0.25rem; }
    .opt-btn { padding: 0.4rem 1.1rem; background: #b87838; color: #1e1610; border: 2px solid #e9e0c6; font-family: Georgia, serif; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .opt-btn:hover { opacity: 0.85; }
    .opt-btn:disabled { opacity: 0.35; cursor: default; }
    .reset-btn { margin-left: auto; padding: 0.4rem 1rem; background: transparent; color: rgba(233,224,198,0.5); border: 1px solid rgba(233,224,198,0.25); font-family: Georgia, serif; font-size: 0.8rem; cursor: pointer; }
    .reset-btn:hover { color: #e9e0c6; }

    /* ── Game screen ── */
    #game-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #fake-header { background: #1e1610; border-bottom: 2.5px solid #1e1610; padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: rgba(233,224,198,0.6); flex-shrink: 0; }
    #fake-header strong { font-family: 'Playfair Display', Georgia, serif; font-size: 0.95rem; color: #d49848; letter-spacing: 1px; }
    .hdr-btns { display: flex; gap: 0.5rem; }
    .hdr-btn { padding: 0.3rem 0.75rem; background: transparent; color: rgba(233,224,198,0.55); border: 1.5px solid rgba(233,224,198,0.25); font-size: 0.75rem; font-family: Georgia, serif; }

    #fake-tor { background: #3a2a1a; border-bottom: 2px solid #1e1610; padding: 0.35rem 1rem; display: flex; gap: 1rem; font-size: 0.8rem; flex-shrink: 0; }
    .tor-slot { color: rgba(233,224,198,0.45); }
    .tor-slot.active { color: #1e1610; background: #b87838; padding: 0.1rem 0.5rem; font-weight: bold; }

    #fake-action { background: #3a2a1a; border-bottom: 2.5px solid #1e1610; padding: 0.9rem 1.2rem; text-align: center; flex-shrink: 0; }
    #fake-action .msg { font-style: italic; color: #d49848; font-size: 0.95rem; }

    #fake-pyramid { background: #1e1610; border-bottom: 2.5px solid #1e1610; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; flex: 1; justify-content: center; }
    .pyr-row { display: flex; gap: 0.35rem; }
    .pyr-card { width: 44px; height: 62px; border: 1.5px solid rgba(233,224,198,0.15); background: rgba(233,224,198,0.04); }
    .pyr-card.face { background: #e9e0c6; border-color: rgba(30,22,16,0.6); }

    /* ── Player zone ── */
    #player-zone {
      background: #e9e0c6;
      border-top: 2.5px solid #1e1610;
      color: #1e1610;
      padding: 0.75rem 1.2rem 1rem;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .zone-stats-bar { display: flex; align-items: center; gap: 1rem; font-size: 0.88rem; color: #3a2a1a; margin-bottom: 0.65rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(30,22,16,0.15); }
    .stat-dollars { font-weight: bold; }
    .stat-bandits { color: #c84e18; font-weight: bold; }
    .zone-hand { display: flex; gap: 0.5rem; margin-bottom: 0.65rem; align-items: flex-end; }
    .fcard { width: 52px; height: 72px; border: 1.5px solid #1e1610; background: #e9e0c6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; color: #1e1610; position: relative; box-shadow: 1px 1px 0 rgba(30,22,16,0.2); flex-shrink: 0; transition: box-shadow 0.15s; }
    .fcard .suit { font-size: 1.4rem; margin-bottom: 2px; }
    .fcard .cost-badge { position: absolute; bottom: 3px; left: 3px; font-size: 0.55rem; background: rgba(30,22,16,0.8); color: #d49848; padding: 0 3px; line-height: 1.5; }
    .fcard.bandit { background: #fdf0ec; }
    .fcard.new-card { opacity: 0; transform: translateY(16px); }
    .zone-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: #3a2a1a; }
    .zone-you { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .herd-num { color: #2a6e1a; font-weight: bold; font-size: 1.2rem; }

    /* Zone busted glow (settles after full-screen fades) */
    #player-zone.busted-settled {
      box-shadow: 0 0 0 2px #c84e18, 0 0 18px rgba(200,78,24,0.35), inset 0 0 24px rgba(200,78,24,0.15);
      border-color: #c84e18;
    }


    /* ══════════════════════════════════════════
       FULL-SCREEN BUST OVERLAY
    ══════════════════════════════════════════ */
    #bust-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      opacity: 0;
    }

    #bust-screen .bust-bg {
      position: absolute;
      inset: 0;
      background: rgba(16, 4, 0, 0.88);
    }

    #bust-screen .bust-bandits {
      position: relative;
      display: flex;
      gap: 1.5rem;
      opacity: 0;
    }

    #bust-screen .big-card {
      width: 90px;
      height: 126px;
      border: 2px solid #c84e18;
      background: #fdf0ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 18px rgba(200,78,24,0.6);
    }

    #bust-screen .bust-word {
      position: relative;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 10rem;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #c84e18;
      text-shadow: 0 0 60px rgba(200,78,24,0.5), 0 4px 0 rgba(0,0,0,0.8);
      opacity: 0;
      line-height: 1;
    }


    /* ── Option A: Stamp straight down ── */
    @keyframes fsStampIn {
      0%   { opacity: 0; }
      1%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes fsBanditsA {
      0%   { opacity: 0; transform: scale(0.6); }
      60%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fsWordStamp {
      0%   { opacity: 1; transform: scale(3) translateY(-40px); }
      50%  { transform: scale(0.92); }
      70%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes fsScreenFadeOut {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    #bust-screen.opt-a { animation: fsStampIn 0.01s forwards; }
    #bust-screen.opt-a .bust-bandits { animation: fsBanditsA 0.4s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    #bust-screen.opt-a .bust-word    { animation: fsWordStamp 0.5s cubic-bezier(0.22,1,0.36,1) 0.55s both; }
    #bust-screen.opt-a.fade-out      { animation: fsScreenFadeOut 0.4s ease-in forwards; }


    /* ── Option B: Shockwave — screen slams in ── */
    @keyframes fsShockIn {
      0%   { opacity: 0; transform: scale(1.08); }
      20%  { opacity: 1; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fsBanditsB {
      0%   { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fsWordShock {
      0%   { opacity: 0; transform: translateY(60px); }
      60%  { opacity: 1; transform: translateY(-8px); }
      80%  { transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    #bust-screen.opt-b { animation: fsShockIn 0.3s cubic-bezier(0.22,1,0.36,1) forwards; }
    #bust-screen.opt-b .bust-bandits { animation: fsBanditsB 0.35s ease-out 0.2s both; }
    #bust-screen.opt-b .bust-word    { animation: fsWordShock 0.45s cubic-bezier(0.22,1,0.36,1) 0.45s both; }
    #bust-screen.opt-b.fade-out      { animation: fsScreenFadeOut 0.4s ease-in forwards; }


    /* ── Option C: Card Spotlight — bandits glow in hand, then full screen ── */
    @keyframes banditHandGlow {
      0%   { box-shadow: none; }
      35%  { box-shadow: 0 0 0 3px #c84e18, 0 0 16px rgba(200,78,24,0.9); }
      65%  { box-shadow: 0 0 0 3px #c84e18, 0 0 16px rgba(200,78,24,0.9); }
      100% { box-shadow: none; }
    }
    @keyframes fsSpotIn {
      /* Slow, deliberate fade to black — not a slap */
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes fsBanditsC {
      /* Cards surface calmly out of the dark */
      0%   { opacity: 0; transform: scale(0.82); }
      70%  { opacity: 1; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fsWordHit {
      0%   { opacity: 0; transform: scale(1.18); letter-spacing: 22px; }
      55%  { opacity: 1; transform: scale(0.98); letter-spacing: 11px; }
      100% { opacity: 1; transform: scale(1);    letter-spacing: 12px; }
    }

    #bust-screen.opt-c                { animation: fsSpotIn   0.65s ease-in-out both; }
    #bust-screen.opt-c .bust-bandits  { animation: fsBanditsC 0.6s  ease-out 0.45s both; }
    #bust-screen.opt-c .bust-word     { animation: fsWordHit  0.3s  ease-out 0.95s both; }
    #bust-screen.opt-c.fade-out       { animation: fsScreenFadeOut 0.55s ease-in-out forwards; }

    .bandit-glowing { animation: banditHandGlow 1.1s ease-out forwards; }

  </style>
</head>
<body>

  <div id="controls">
    <span class="label">Try:</span>
    <button class="opt-btn" id="btn-a" onclick="trigger('opt-a', 0)">A — Stamp</button>
    <button class="opt-btn" id="btn-b" onclick="trigger('opt-b', 0)">B — Shockwave</button>
    <button class="opt-btn" id="btn-c" onclick="trigger('opt-c', 950)">C — Card Spotlight</button>
    <button class="reset-btn" onclick="resetAll()">Reset</button>
  </div>

  <div id="game-screen">
    <div id="fake-header">
      <strong>Act 2 &nbsp;|&nbsp; Round 4</strong>
      <div class="hdr-btns">
        <div class="hdr-btn">My Deck</div>
        <div class="hdr-btn">Rules</div>
      </div>
    </div>

    <div id="fake-tor">
      <span class="tor-slot active">You</span>
      <span class="tor-slot">›</span>
      <span class="tor-slot">Buffalo Bill</span>
      <span class="tor-slot">›</span>
      <span class="tor-slot">Wild Mary</span>
    </div>

    <div id="fake-action">
      <div class="msg">Keep drawing or bank what you have.</div>
    </div>

    <div id="fake-pyramid">
      <div class="pyr-row"><div class="pyr-card"></div></div>
      <div class="pyr-row"><div class="pyr-card"></div><div class="pyr-card"></div></div>
      <div class="pyr-row"><div class="pyr-card face"></div><div class="pyr-card face"></div><div class="pyr-card face"></div></div>
    </div>

    <div id="player-zone">
      <div class="zone-stats-bar">
        <span class="stat-dollars">$3</span>
        <span>🐄 2</span>
        <span class="stat-bandits">B: 3</span>
        <span style="margin-left:auto;font-size:0.8rem;color:#888">Deck: 5 &nbsp; Discard: 3</span>
      </div>
      <div class="zone-hand">
        <div class="fcard"><span class="suit">🐟</span><div class="cost-badge">$1</div></div>
        <div class="fcard"><span class="suit">🐟</span><div class="cost-badge">$2</div></div>
        <div class="fcard bandit bandit-card"><span class="suit">🤠</span><div class="cost-badge">B</div></div>
        <div class="fcard bandit bandit-card"><span class="suit">🤠</span><div class="cost-badge">B</div></div>
        <div class="fcard bandit bandit-card new-card" id="bandit-card"><span class="suit">🤠</span><div class="cost-badge">B</div></div>
      </div>
      <div class="zone-footer">
        <span class="zone-you">You</span>
        <span>HERD &nbsp;<span class="herd-num">18</span></span>
      </div>
    </div>
  </div>

  <!-- Full-screen bust overlay -->
  <div id="bust-screen">
    <div class="bust-bg"></div>
    <div class="bust-bandits">
      <div class="big-card">🤠</div>
      <div class="big-card">🤠</div>
      <div class="big-card">🤠</div>
    </div>
    <div class="bust-word">BUSTED</div>
  </div>

  <script>
    let active = null;
    let fadeTimer = null;

    function trigger(optClass, spotlightDelay) {
      resetAll(false);
      ['btn-a','btn-b','btn-c'].forEach(id => document.getElementById(id).disabled = true);

      const card = document.getElementById('bandit-card');
      const screen = document.getElementById('bust-screen');
      const zone = document.getElementById('player-zone');

      // 1. New card slides in
      card.style.transition = 'opacity 0.2s ease-out, transform 0.25s cubic-bezier(0.22,1,0.36,1)';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';

      // 2. For Card Spotlight (C): glow all bandits in hand first
      if (optClass === 'opt-c') {
        setTimeout(() => {
          document.querySelectorAll('.bandit-card').forEach(el => el.classList.add('bandit-glowing'));
        }, 350);
      }

      // 3. Full-screen overlay fires
      setTimeout(() => {
        active = optClass;
        screen.classList.add(optClass);

        // 4. Fade out overlay after it's held for a beat
        fadeTimer = setTimeout(() => {
          screen.classList.add('fade-out');
          // 5. After fade, settle the zone
          setTimeout(() => {
            screen.classList.remove(optClass, 'fade-out');
            zone.classList.add('busted-settled');
            ['btn-a','btn-b','btn-c'].forEach(id => document.getElementById(id).disabled = false);
          }, 560);
        }, 2500);

      }, 350 + spotlightDelay);
    }

    function resetAll(reenable = true) {
      clearTimeout(fadeTimer);

      const card = document.getElementById('bandit-card');
      const screen = document.getElementById('bust-screen');
      const zone = document.getElementById('player-zone');

      if (active) screen.classList.remove(active);
      screen.classList.remove('fade-out');
      zone.classList.remove('busted-settled');
      document.querySelectorAll('.bandit-card').forEach(el => el.classList.remove('bandit-glowing'));
      active = null;

      card.style.transition = 'none';
      card.style.opacity = '0';
      card.style.transform = 'translateY(16px)';

      if (reenable) {
        ['btn-a','btn-b','btn-c'].forEach(id => document.getElementById(id).disabled = false);
      }
    }
  </script>
</body>
</html>
