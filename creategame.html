<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Game - Cards For Cowboys</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #1e1610;
      background-color: #e9e0c6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-ui {
      background: #e9e0c6;
      border: 2.5px solid #1e1610;
      box-shadow: 6px 6px 0 #1e1610;
      padding: 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 1.8rem;
      color: #1e1610;
      margin-bottom: 0.25rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle { color: #3a2a1a; font-style: italic; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 0.75rem;
      background: #b87838;
      color: #1e1610;
      border: 2.5px solid #1e1610;
      font-size: 1rem;
      font-family: Georgia, serif;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0 #1e1610;
      transition: transform 0.07s, box-shadow 0.07s;
    }
    .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1e1610; }
    .btn-secondary { background: #e9e0c6; color: #1e1610; font-weight: normal; }
    .btn-secondary:hover { box-shadow: 2px 2px 0 #1e1610; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 #1e1610; }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 2.5px solid #1e1610;
      font-size: 1rem;
      font-family: Georgia, serif;
      background: #e9e0c6;
      color: #1e1610;
      margin-bottom: 0.75rem;
      text-align: center;
    }
    input[type="text"]:focus { outline: none; box-shadow: 0 0 0 2px #b87838; }
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b87838;
      margin-bottom: 1rem;
    }
    .status {
      padding: 0.75rem;
      border: 2px solid #1e1610;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .status.error { background: rgba(200,78,24,0.12); color: #c84e18; border-color: #c84e18; }
    .game-code {
      font-size: 2.5rem;
      font-weight: bold;
      color: #d49848;
      letter-spacing: 6px;
      padding: 0.5rem;
      background: #3a2a1a;
      border: 2.5px solid #1e1610;
      margin: 0.75rem 0;
    }
    .share-link {
      font-size: 0.75rem;
      color: #b87838;
      word-break: break-all;
      margin-bottom: 1rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .back-link {
      display: block;
      margin-top: 1.5rem;
      color: rgba(30,22,16,0.5);
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
    }
    .back-link:hover { color: #1e1610; }
    .waiting-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
    }
    .hidden { display: none !important; }
    .slot-list {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
    }
    .lobby-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: #e9e0c6;
      border: 2px solid #1e1610;
      font-size: 0.9rem;
    }
    .lobby-slot-label { color: #1e1610; }
    .slot-status {
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      font-style: italic;
    }
    .slot-status.filled { background: rgba(42,110,26,0.15); color: #2a6e1a; font-style: normal; font-weight: bold; }
    .slot-status.waiting { background: rgba(184,120,56,0.15); color: #b87838; }
    .slot-status.ai { background: rgba(26,122,150,0.15); color: #1a7a96; }
  </style>
</head>
<body>
<div class="card-ui">
  <h1>Cards For Cowboys</h1>
  <p class="subtitle">Create a Game</p>

  <!-- Screen 1: Name entry -->
  <div id="screen-name">
    <p class="section-label">Enter your name</p>
    <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button class="btn" id="btn-create">Create Game</button>
    <a href="gamesetup.html" class="back-link">← Back to setup</a>
  </div>

  <!-- Screen 2: Waiting for opponents (host) -->
  <div id="screen-waiting" class="hidden">
    <p class="section-label">Game created! Share this code:</p>
    <div class="game-code" id="display-code"></div>
    <div class="share-link" id="share-link" onclick="copyShareLink()">Click to copy invite link</div>
    <div class="share-link" id="spectate-link" onclick="copySpectateLink()" style="margin-top:-0.25rem;font-size:0.7rem;color:#5c3a1e">Copy spectator link</div>
    <div id="waiting-slot-list" class="slot-list"></div>
    <button class="btn btn-secondary" id="btn-cancel-host">Cancel</button>
  </div>

  <!-- Error display -->
  <div id="screen-error" class="hidden">
    <div class="status error" id="error-msg"></div>
    <button class="btn" id="btn-error-back">Try Again</button>
  </div>
</div>

<script type="module" src="src/creategame.js"></script>
</body>
</html>
