<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSTED Animation Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1e1610;
      font-family: Georgia, serif;
      color: #e9e0c6;
      padding: 2rem;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      color: #d49848;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: rgba(233,224,198,0.45);
      font-style: italic;
      margin-bottom: 2.5rem;
    }

    .demos {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 220px;
    }

    .demo-label {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d49848;
      text-align: center;
    }

    /* ── Fake player zone ── */
    .player-zone {
      width: 220px;
      border: 2px solid #1e1610;
      background: #e9e0c6;
      color: #1e1610;
      padding: 0.75rem 1rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .zone-name {
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #3a2a1a;
      margin-bottom: 0.2rem;
    }

    .zone-herd {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2a6e1a;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .zone-stats {
      font-size: 0.8rem;
      color: #3a2a1a;
    }

    .zone-bandits { color: #c84e18; font-weight: bold; }

    /* Shared BUSTED label — hidden by default */
    .busted-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c84e18;
      pointer-events: none;
      opacity: 0;
    }

    /* ── Trigger buttons ── */
    .trigger-btn {
      padding: 0.5rem 1.4rem;
      background: #b87838;
      color: #1e1610;
      border: 2px solid #e9e0c6;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.1s;
    }
    .trigger-btn:hover { opacity: 0.85; }

    .reset-btn {
      background: transparent;
      color: rgba(233,224,198,0.4);
      border: 1px solid rgba(233,224,198,0.2);
      padding: 0.3rem 0.9rem;
      font-family: Georgia, serif;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .reset-btn:hover { color: rgba(233,224,198,0.7); }


    /* ════════════════════════════════
       OPTION 1 — RUBBER STAMP
    ════════════════════════════════ */
    @keyframes stamp-drop {
      0%   { opacity: 1; transform: scale(3) translateY(-10px); }
      60%  { transform: scale(0.9) translateY(0); }
      80%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes border-flash {
      0%   { box-shadow: 0 0 0 3px #c84e18, 0 0 20px rgba(200,78,24,0.8); }
      50%  { box-shadow: 0 0 0 4px #c84e18, 0 0 30px rgba(200,78,24,0.9); }
      100% { box-shadow: 0 0 0 2px #c84e18, 0 0 10px rgba(200,78,24,0.3), inset 0 0 12px rgba(200,78,24,0.2); }
    }

    .zone-stamp.busted {
      animation: border-flash 0.5s ease-out forwards;
      border-color: #c84e18;
    }
    .zone-stamp.busted .busted-label {
      opacity: 1;
      animation: stamp-drop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow: 2px 2px 0 rgba(200,78,24,0.3);
    }


    /* ════════════════════════════════
       OPTION 2 — THREE STRIKES
    ════════════════════════════════ */
    @keyframes strike-pulse {
      0%   { box-shadow: none; border-color: #1e1610; }
      10%  { box-shadow: 0 0 0 3px #c84e18, 0 0 15px rgba(200,78,24,0.7); border-color: #c84e18; }
      25%  { box-shadow: none; border-color: #1e1610; }
      35%  { box-shadow: 0 0 0 3px #c84e18, 0 0 15px rgba(200,78,24,0.7); border-color: #c84e18; }
      50%  { box-shadow: none; border-color: #1e1610; }
      60%  { box-shadow: 0 0 0 3px #c84e18, 0 0 15px rgba(200,78,24,0.7); border-color: #c84e18; }
      75%  { box-shadow: none; border-color: #1e1610; }
      100% { box-shadow: 0 0 0 2px #c84e18, 0 0 10px rgba(200,78,24,0.3), inset 0 0 12px rgba(200,78,24,0.2); border-color: #c84e18; }
    }

    @keyframes strikes-label-in {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    .zone-strikes.busted {
      animation: strike-pulse 1.1s ease-out forwards;
    }
    .zone-strikes.busted .busted-label {
      animation: strikes-label-in 0.35s ease-in 1s forwards;
      opacity: 0;
    }


    /* ════════════════════════════════
       OPTION 3 — WANTED POSTER SLAP
    ════════════════════════════════ */
    @keyframes flash-white {
      0%   { background: #e9e0c6; }
      8%   { background: #fff; }
      20%  { background: #e9e0c6; }
      100% { background: #e9e0c6; }
    }

    @keyframes border-snap {
      0%   { border-color: #1e1610; box-shadow: none; }
      8%   { border-color: #c84e18; box-shadow: 0 0 0 3px #c84e18, 0 0 20px rgba(200,78,24,0.8); }
      100% { border-color: #c84e18; box-shadow: 0 0 0 2px #c84e18, 0 0 10px rgba(200,78,24,0.3), inset 0 0 12px rgba(200,78,24,0.2); }
    }

    @keyframes poster-slap {
      0%   { opacity: 0; transform: translateX(60px) rotate(3deg); }
      55%  { opacity: 1; transform: translateX(-6px) rotate(-1deg); }
      70%  { transform: translateX(3px) rotate(0.5deg); }
      83%  { transform: translateX(-2px) rotate(-0.3deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    .zone-poster.busted {
      animation: flash-white 0.5s ease-out forwards, border-snap 0.6s ease-out forwards;
    }
    .zone-poster.busted .busted-label {
      opacity: 1;
      animation: poster-slap 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.06s both;
    }

  </style>
</head>
<body>

  <h1>BUSTED — Animation Options</h1>
  <p class="subtitle">Click each trigger to preview. Use Reset to replay.</p>

  <div class="demos">

    <!-- Option 1: Rubber Stamp -->
    <div class="demo-block">
      <div class="demo-label">1 — Rubber Stamp</div>
      <div class="player-zone zone-stamp" id="zone1">
        <div class="busted-label">BUSTED</div>
        <div class="zone-name">Wild Mary</div>
        <div class="zone-herd">28</div>
        <div class="zone-stats">$2 &nbsp; 🐄1 &nbsp; <span class="zone-bandits">B:3</span></div>
      </div>
      <button class="trigger-btn" onclick="trigger('zone1')">Draw 3rd Bandit</button>
      <button class="reset-btn" onclick="reset('zone1')">Reset</button>
    </div>

    <!-- Option 2: Three Strikes -->
    <div class="demo-block">
      <div class="demo-label">2 — Three Strikes</div>
      <div class="player-zone zone-strikes" id="zone2">
        <div class="busted-label">BUSTED</div>
        <div class="zone-name">Wild Mary</div>
        <div class="zone-herd">28</div>
        <div class="zone-stats">$2 &nbsp; 🐄1 &nbsp; <span class="zone-bandits">B:3</span></div>
      </div>
      <button class="trigger-btn" onclick="trigger('zone2')">Draw 3rd Bandit</button>
      <button class="reset-btn" onclick="reset('zone2')">Reset</button>
    </div>

    <!-- Option 3: Wanted Poster Slap -->
    <div class="demo-block">
      <div class="demo-label">3 — Wanted Poster</div>
      <div class="player-zone zone-poster" id="zone3">
        <div class="busted-label">BUSTED</div>
        <div class="zone-name">Wild Mary</div>
        <div class="zone-herd">28</div>
        <div class="zone-stats">$2 &nbsp; 🐄1 &nbsp; <span class="zone-bandits">B:3</span></div>
      </div>
      <button class="trigger-btn" onclick="trigger('zone3')">Draw 3rd Bandit</button>
      <button class="reset-btn" onclick="reset('zone3')">Reset</button>
    </div>

  </div>

  <script>
    function trigger(id) {
      const zone = document.getElementById(id);
      zone.classList.remove('busted');
      // force reflow so re-adding the class re-fires the animation
      void zone.offsetWidth;
      zone.classList.add('busted');
    }

    function reset(id) {
      document.getElementById(id).classList.remove('busted');
    }
  </script>

</body>
</html>
