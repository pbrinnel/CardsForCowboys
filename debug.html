<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug — Cards For Cowboys</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1e1610;
      font-family: Georgia, 'Times New Roman', serif;
      color: #e9e0c6;
      padding: 2rem;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 1.6rem;
      color: #d49848;
      margin-bottom: 0.25rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.85rem;
      color: rgba(233,224,198,0.45);
      font-style: italic;
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #b87838;
      margin-bottom: 0.75rem;
      margin-top: 1.75rem;
      border-bottom: 1.5px solid #3a2a1a;
      padding-bottom: 0.3rem;
    }
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
    }
    .scenario-btn {
      background: #2a1e12;
      border: 2px solid #3a2a1a;
      padding: 0.7rem 1rem;
      color: #e9e0c6;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.12s, box-shadow 0.12s;
      box-shadow: 2px 2px 0 #3a2a1a;
    }
    .scenario-btn:hover {
      border-color: #b87838;
      box-shadow: 2px 2px 0 #b87838;
      color: #d49848;
    }
    .scenario-btn .label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.2rem;
    }
    .scenario-btn .desc {
      font-size: 0.78rem;
      color: rgba(233,224,198,0.45);
      font-style: italic;
    }
    .back-link {
      display: inline-block;
      margin-top: 2.5rem;
      color: rgba(233,224,198,0.4);
      font-size: 0.82rem;
      text-decoration: none;
    }
    .back-link:hover { color: #e9e0c6; }
  </style>
</head>
<body>
  <h1>Debug Launcher</h1>
  <p class="subtitle">Jumps directly into a game state — bypasses normal setup.</p>

  <div class="section-title">Game Scenarios</div>
  <div class="scenario-grid">
    <button class="scenario-btn" onclick="launch('near_showdown')">
      <span class="label">Near Showdown</span>
      <span class="desc">4P · Act 3 · last ~6 cards · competitive herds</span>
    </button>
    <button class="scenario-btn" onclick="launch('act3_one_card')">
      <span class="label">One Card → Showdown</span>
      <span class="desc">4P · Act 3 · 1 card left · buy it to trigger showdown</span>
    </button>
    <button class="scenario-btn" onclick="launch('act3_one_card_hidden')">
      <span class="label">One Card → Showdown (Hidden Herd)</span>
      <span class="desc">4P · Act 3 · 1 card left · hidden herd mode on</span>
    </button>
  </div>

  <div class="section-title">Special Cards</div>
  <div class="scenario-grid">
    <button class="scenario-btn" onclick="launch('special_burn_to_use')">
      <span class="label">Burn to Use</span>
      <span class="desc">Act 1 · card_77 · burn from hand to activate for $</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_2cow_if_first')">
      <span class="label">2 Cows If First</span>
      <span class="desc">Act 1 · card_15 · bonus cows if first card drawn</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_burn_buy_first')">
      <span class="label">Burn → Buy Priority</span>
      <span class="desc">Act 1 · card_14 · burn for first buy priority</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_burn_for_2_card16')">
      <span class="label">Burn for $2 (Cactus)</span>
      <span class="desc">Act 2 · card_16 · $1 or burn for $2</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_look3_rearrange')">
      <span class="label">Look 3, Rearrange</span>
      <span class="desc">Act 2 · card_19 · peek and reorder top 3</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_copy_next')">
      <span class="label">Copy Next Card</span>
      <span class="desc">Act 2 · card_20 · next card has double effect</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_burn_for_2')">
      <span class="label">Burn for $2</span>
      <span class="desc">Act 2 · card_22 · River · $1 or burn for $2</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_extra_buy')">
      <span class="label">Extra Buy</span>
      <span class="desc">Act 2 · card_21 · burn for extra turn in buy phase</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_replay_discard')">
      <span class="label">Replay Discard</span>
      <span class="desc">Act 2 · card_23 · burn to replay any discarded card</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_dollar1_other')">
      <span class="label">$1 to Others</span>
      <span class="desc">Act 2 · card_24 · gives $1 to each opponent</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_discard_to_player')">
      <span class="label">Discard to Player</span>
      <span class="desc">Act 2 · card_4 · 4P · passed to next player</span>
    </button>
    <button class="scenario-btn" onclick="launch('special_look3_immediate')">
      <span class="label">Look 3, Immediate</span>
      <span class="desc">Act 3 · card_31 · reveal top 3 immediately</span>
    </button>
    <button class="scenario-btn" onclick="launch('draw4_jail_2bandits')">
      <span class="label">Draw 4 + Jail @ 2 Bandits</span>
      <span class="desc">Act 2 · 2 bandits, then Draw 4 with a -1 bandit card next</span>
    </button>
    <button class="scenario-btn" onclick="launch('buy_phase_burn_to_use')">
      <span class="label">Buy Phase: Activate for $</span>
      <span class="desc">Act 1 · draw $1+$1+card_77, stop without activating → use +$2 in buy phase</span>
    </button>
    <button class="scenario-btn" onclick="launch('buy_phase_all_activatable')">
      <span class="label">Buy Phase: All Activatable</span>
      <span class="desc">Act 2 · all 4 dollar cards in hand (card_77/78 +$2, card_16/22 +$1) · up to +$6 in buy phase</span>
    </button>
  </div>

  <div class="section-title">Copy Next Interactions</div>
  <div class="scenario-grid">
    <button class="scenario-btn" onclick="launch('copy_next_jail')">
      <span class="label">Copy Next → Jail (−1 Bandit)</span>
      <span class="desc">Act 2 · card_20→card_50 · both become activatable; 2 bandits follow to test them</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_dollar')">
      <span class="label">Copy Next → Burn-to-Use $2</span>
      <span class="desc">Act 2 · card_20→card_77 · both activatable for $2 each → up to $4</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_burn_for_2')">
      <span class="label">Copy Next → Burn for $2</span>
      <span class="desc">Act 2 · card_20→card_16 · Copy Next becomes 2nd activatable copy for $2</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_priority')">
      <span class="label">Copy Next → Buy Priority</span>
      <span class="desc">Act 2 · card_20→card_14 · both burnable for buy priority</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_look3')">
      <span class="label">Copy Next → Look 3 Rearrange</span>
      <span class="desc">Act 2 · card_20→card_19 · both burnable for a separate peek+reorder</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_replay')">
      <span class="label">Copy Next → Replay Discard</span>
      <span class="desc">Act 2 · card_20→card_23 · discard seeded; both burnable for a separate replay</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_extra_buy')">
      <span class="label">Copy Next → Extra Buy</span>
      <span class="desc">Act 2 · card_20→card_21 · both burnable for a bonus buy/burn each</span>
    </button>
    <button class="scenario-btn" onclick="launch('copy_next_chain')">
      <span class="label">Copy Next → Copy Next → card</span>
      <span class="desc">Act 2 · card_20→card_20→card_79 · chain: 2nd Copy Next re-arms doubling for 3rd draw</span>
    </button>
  </div>

  <a href="index.html" class="back-link">← Back to Home</a>

  <script>
    function launch(scenario) {
      sessionStorage.setItem('debug_scenario', scenario);
      window.location.href = 'playgame.html';
    }
  </script>
</body>
</html>
