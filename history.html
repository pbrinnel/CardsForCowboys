<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game History - Cards For Cowboys</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #1e1610;
      background-color: #e9e0c6;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .page {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 2rem;
      color: #1e1610;
      margin-bottom: 0.3rem;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      text-align: center;
      color: #3a2a1a;
      font-style: italic;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: rgba(30,22,16,0.5);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .back-link:hover { color: #1e1610; }
    #status {
      text-align: center;
      color: #3a2a1a;
      font-style: italic;
      padding: 2rem;
    }

    /* ── Live games section ── */
    #live-section {
      margin-bottom: 2rem;
    }
    #live-section h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 1rem;
      color: #1e1610;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #c84e18;
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .live-cards {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .live-card {
      background: #e9e0c6;
      border: 2px solid #1e1610;
      border-left: 4px solid #c84e18;
      box-shadow: 2px 2px 0 #1e1610;
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .live-card-info { flex: 1; }
    .live-card-players {
      font-size: 0.9rem;
      color: #1e1610;
      margin-bottom: 0.2rem;
    }
    .live-card-meta {
      font-size: 0.75rem;
      color: #b87838;
      font-style: italic;
    }
    .btn-spectate {
      background: #b87838;
      color: #1e1610;
      border: 2px solid #1e1610;
      box-shadow: 2px 2px 0 #1e1610;
      padding: 0.4rem 0.85rem;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.07s, box-shadow 0.07s;
    }
    .btn-spectate:hover { transform: translate(1px,1px); box-shadow: 1px 1px 0 #1e1610; }
    #live-empty {
      color: #3a2a1a;
      font-style: italic;
      font-size: 0.9rem;
    }

    /* ── Section label ── */
    .section-label {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 1rem;
      color: #1e1610;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── History + leaderboard tables ── */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #e9e0c6;
      border: 2.5px solid #1e1610;
      box-shadow: 4px 4px 0 #1e1610;
      font-size: 0.9rem;
    }
    thead {
      background: #1e1610;
      color: #e9e0c6;
    }
    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: normal;
      letter-spacing: 0.5px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid rgba(30,22,16,0.15);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: rgba(30,22,16,0.04); }
    .winner-name {
      font-weight: bold;
      color: #1e1610;
    }
    .player-list {
      line-height: 1.6;
    }
    .player-winner { font-weight: bold; }
    .player-ai { color: #b87838; font-style: italic; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.4rem;
      font-size: 0.75rem;
    }
    .badge-mp  { background: rgba(26,122,150,0.15); color: #1a7a96; }
    .badge-ai  { background: rgba(184,120,56,0.15); color: #b87838; }
    .tie-label { color: #b87838; font-style: italic; }
    .btn-review {
      display: inline-block;
      background: #1e1610;
      color: #e9e0c6;
      border: 2px solid #1e1610;
      padding: 0.25rem 0.6rem;
      font-family: Georgia, serif;
      font-size: 0.78rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-review:hover { background: #3a2a1a; }

    /* ── Leaderboard ── */
    #leaderboard-section {
      margin-bottom: 2rem;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      background: #e9e0c6;
      border: 2.5px solid #1e1610;
      box-shadow: 4px 4px 0 #1e1610;
      font-size: 0.9rem;
    }
    .leaderboard-table thead { background: #1e1610; color: #e9e0c6; }
    .leaderboard-table th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: normal;
      letter-spacing: 0.5px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .leaderboard-table td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid rgba(30,22,16,0.15);
    }
    .leaderboard-table tr:last-child td { border-bottom: none; }
    .leaderboard-table tr:nth-child(even) td { background: rgba(30,22,16,0.04); }
    .rank-cell { color: #b87838; font-size: 0.85rem; width: 2rem; }
    .rank-gold   { color: #b87838; font-weight: bold; }
    .rank-silver { color: #707070; font-weight: bold; }
    .rank-bronze { color: #8c3010; font-weight: bold; }
    .herd-count  { font-weight: bold; color: #2a6e1a; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
      gap: 0.5rem;
    }
    .pagination-info {
      font-size: 0.82rem;
      color: #3a2a1a;
      font-style: italic;
    }
    .pagination-btns {
      display: flex;
      gap: 0.5rem;
    }
    .btn-page {
      background: #1e1610;
      color: #e9e0c6;
      border: 2px solid #1e1610;
      box-shadow: 2px 2px 0 rgba(30,22,16,0.4);
      padding: 0.3rem 0.75rem;
      font-family: Georgia, serif;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.07s, box-shadow 0.07s;
    }
    .btn-page:hover:not(:disabled) { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(30,22,16,0.4); }
    .btn-page:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: 2px 2px 0 rgba(30,22,16,0.4); }

    @media (max-width: 600px) {
      th, td { padding: 0.5rem 0.6rem; font-size: 0.8rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="page">
  <a href="index.html" class="back-link">← Back to home</a>
  <h1>Game History</h1>
  <p class="subtitle">Live games and completed matches</p>

  <!-- Live games -->
  <div id="live-section">
    <h2><span class="live-dot"></span> Live Now</h2>
    <div class="live-cards" id="live-cards">
      <div id="live-empty">No games in progress right now.</div>
    </div>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboard-section">
    <div class="section-label">Biggest Herds</div>
    <table class="leaderboard-table" id="leaderboard-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Herd</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

  <!-- Completed games -->
  <div class="section-label">Completed Games</div>
  <div id="status">Loading…</div>
  <table id="history-table" style="display:none">
    <thead>
      <tr>
        <th>Date</th>
        <th>Mode</th>
        <th>Players &amp; Scores</th>
        <th>Winner</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
  <div class="pagination" id="history-pagination" style="display:none">
    <div class="pagination-info" id="pagination-info"></div>
    <div class="pagination-btns">
      <button class="btn-page" id="btn-prev">← Prev</button>
      <button class="btn-page" id="btn-next">Next →</button>
    </div>
  </div>
</div>

<script type="module">
import { db } from './src/firebase-config.js';
import {
  ref, query, limitToLast, onValue
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const statusEl      = document.getElementById('status');
const tableEl       = document.getElementById('history-table');
const bodyEl        = document.getElementById('history-body');
const liveCardsEl   = document.getElementById('live-cards');
const liveEmptyEl   = document.getElementById('live-empty');
const paginationEl  = document.getElementById('history-pagination');
const paginInfoEl   = document.getElementById('pagination-info');
const btnPrev       = document.getElementById('btn-prev');
const btnNext       = document.getElementById('btn-next');

const PAGE_SIZE = 5;
let allRows    = [];
let currentPage = 0;

btnPrev.addEventListener('click', () => { currentPage--; renderHistoryPage(); });
btnNext.addEventListener('click', () => { currentPage++; renderHistoryPage(); });

function renderHistoryPage() {
  const total = allRows.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  currentPage = Math.max(0, Math.min(currentPage, totalPages - 1));

  const start = currentPage * PAGE_SIZE;
  const pageRows = allRows.slice(start, start + PAGE_SIZE);

  bodyEl.innerHTML = '';
  for (const r of pageRows) {
    const tr = document.createElement('tr');

    const tdDate = document.createElement('td');
    tdDate.textContent = r.ts ? formatDate(r.ts) : '—';
    tr.appendChild(tdDate);

    const tdMode = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = r.mode === 'mp' ? 'badge badge-mp' : 'badge badge-ai';
    badge.textContent = r.mode === 'mp' ? 'Online' : 'vs AI';
    tdMode.appendChild(badge);
    tr.appendChild(tdMode);

    const tdPlayers = document.createElement('td');
    tdPlayers.className = 'player-list';
    (r.players || []).forEach(p => {
      const line = document.createElement('div');
      const classes = [];
      if (p.isWinner) classes.push('player-winner');
      if (!p.isHuman) classes.push('player-ai');
      if (classes.length) line.className = classes.join(' ');
      line.textContent = `${p.name}: ${p.herd} cow${p.herd !== 1 ? 's' : ''}${!p.isHuman ? ' (AI)' : ''}`;
      tdPlayers.appendChild(line);
    });
    tr.appendChild(tdPlayers);

    const tdWinner = document.createElement('td');
    if (r.winner) {
      tdWinner.className = 'winner-name';
      tdWinner.textContent = r.winner;
    } else {
      tdWinner.innerHTML = '<span class="tie-label">Tie</span>';
    }
    tr.appendChild(tdWinner);

    const tdReview = document.createElement('td');
    if (r.gameCode) {
      const link = document.createElement('a');
      link.className = 'btn-review';
      link.href = r.mode === 'ai'
        ? `spectate.html?code=${r.gameCode}&ai=1`
        : `spectate.html?code=${r.gameCode}`;
      link.textContent = 'Review';
      link.target = '_blank';
      tdReview.appendChild(link);
    }
    tr.appendChild(tdReview);

    bodyEl.appendChild(tr);
  }

  paginInfoEl.textContent = `${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total}`;
  btnPrev.disabled = currentPage === 0;
  btnNext.disabled = currentPage >= totalPages - 1;
  paginationEl.style.display = total > PAGE_SIZE ? 'flex' : 'none';
}

// Stale threshold: AI games that haven't pushed state in >5 min are considered dead
const STALE_MS = 5 * 60 * 1000;

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
    + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

// ── Live games ──────────────────────────────────────────────

// Merge MP games (games/) and AI games (liveGames/) into one live list.
// We keep two Maps keyed by code and re-render whenever either updates.
const mpLive  = new Map(); // code → game object
const aiLive  = new Map(); // code → game object

function renderLive() {
  const now = Date.now();
  const live = [];

  mpLive.forEach((g, code) => {
    if (g.status !== 'active') return;
    if (!g.spectatorState) return;
    // Stale-detection: if last spectator push was >10 min ago, hide (game likely abandoned)
    const lastTs = g.spectatorState?.ts || g.createdAt || 0;
    if (now - lastTs > 10 * 60 * 1000) return;
    live.push({ code, spectateUrl: `spectate.html?code=${code}`, ...g });
  });

  aiLive.forEach((g, code) => {
    if (g.status !== 'active') return;
    // Stale-detection: if last push was >5 min ago the tab probably closed
    const lastTs = g.spectatorState?.ts || g.createdAt || 0;
    if (now - lastTs > STALE_MS) return;
    if (!g.spectatorState) return;
    live.push({ code, spectateUrl: `spectate.html?code=${code}&ai=1`, ...g });
  });

  liveCardsEl.innerHTML = '';

  if (live.length === 0) {
    liveCardsEl.appendChild(liveEmptyEl);
    return;
  }

  live.forEach(g => {
    const players = g.players || [];
    const playerStr = players.map(p => p.name + (!p.isHuman ? ' (AI)' : '')).join(' vs ');
    const phase = g.spectatorState?.phase || '';
    const act   = g.spectatorState?.act   || '';
    const round = g.spectatorState?.round || '';
    const phaseLabel = { draw: 'Draw Phase', buy: 'Buy Phase', score: 'Scoring', showdown: 'Showdown!', gameOver: 'Game Over' }[phase] || '';

    const card = document.createElement('div');
    card.className = 'live-card';

    const info = document.createElement('div');
    info.className = 'live-card-info';

    const pLine = document.createElement('div');
    pLine.className = 'live-card-players';
    const modeBadge = document.createElement('span');
    modeBadge.className = g.mode === 'mp' ? 'badge badge-mp' : 'badge badge-ai';
    modeBadge.textContent = g.mode === 'mp' ? 'Online' : 'vs AI';
    modeBadge.style.marginRight = '0.4rem';
    pLine.appendChild(modeBadge);
    pLine.appendChild(document.createTextNode(playerStr));
    info.appendChild(pLine);

    if (act && round && phaseLabel) {
      const meta = document.createElement('div');
      meta.className = 'live-card-meta';
      meta.textContent = `Act ${act} · Round ${round} · ${phaseLabel}`;
      info.appendChild(meta);
    }

    card.appendChild(info);

    const btn = document.createElement('a');
    btn.className = 'btn-spectate';
    btn.textContent = 'Spectate';
    btn.href = g.spectateUrl;
    card.appendChild(btn);

    liveCardsEl.appendChild(card);
  });
}

// MP games: games/ path (status written by host via setLiveStatus)
onValue(ref(db, 'games'), (snap) => {
  mpLive.clear();
  snap.forEach(child => {
    const g = child.val();
    if (g) mpLive.set(child.key, g);
  });
  renderLive();
});

// AI games: liveGames/ path (written by AI_SPEC in play.js)
onValue(ref(db, 'liveGames'), (snap) => {
  aiLive.clear();
  snap.forEach(child => {
    const g = child.val();
    if (g) aiLive.set(child.key, g);
  });
  renderLive();
});

// ── Completed games ─────────────────────────────────────────

// Firebase push() keys are chronological, so limitToLast(100) by key gives the
// 100 most recent entries. We then sort by ts client-side (avoids needing a
// Firebase index, which would cause onValue to silently fail without one).
const q = query(ref(db, 'gameHistory'), limitToLast(100));

onValue(q, (snap) => {
  const rows = [];
  // Note: snap.forEach() has a known SDK quirk where it can silently skip
  // entries; iterate snap.val() directly to ensure all rows are included.
  const val = snap.val();
  if (val) Object.keys(val).forEach(k => rows.push(val[k]));
  rows.sort((a, b) => (b.ts || 0) - (a.ts || 0)); // newest first

  if (rows.length === 0) {
    statusEl.textContent = 'No games recorded yet. Play a game to see history here!';
    return;
  }

  // ── Leaderboard: top herd scores (human only, all entries including repeat names) ──
  const allScores = [];
  for (const r of rows) {
    for (const p of (r.players || [])) {
      if (!p.isHuman) continue;
      allScores.push({ name: p.name, herd: p.herd, ts: r.ts });
    }
  }
  const leaderboard = allScores
    .sort((a, b) => b.herd - a.herd)
    .slice(0, 10);

  const lbBodyEl  = document.getElementById('leaderboard-body');
  const lbTableEl = document.getElementById('leaderboard-table');
  lbBodyEl.innerHTML = '';
  if (leaderboard.length > 0) {
    lbTableEl.style.display = 'table';
    let rank = 0;
    leaderboard.forEach((entry, i) => {
      if (i === 0 || entry.herd !== leaderboard[i - 1].herd) rank = i + 1;
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.className = 'rank-cell' + (rank === 1 ? ' rank-gold' : rank === 2 ? ' rank-silver' : rank === 3 ? ' rank-bronze' : '');
      tdRank.textContent = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
      tr.appendChild(tdRank);

      const tdName = document.createElement('td');
      tdName.textContent = entry.name;
      tr.appendChild(tdName);

      const tdHerd = document.createElement('td');
      tdHerd.className = 'herd-count';
      tdHerd.textContent = `${entry.herd} cow${entry.herd !== 1 ? 's' : ''}`;
      tr.appendChild(tdHerd);

      const tdDate = document.createElement('td');
      tdDate.style.color = '#b87838';
      tdDate.style.fontSize = '0.8rem';
      tdDate.textContent = entry.ts ? formatDate(entry.ts) : '—';
      tr.appendChild(tdDate);

      lbBodyEl.appendChild(tr);
    });
  }

  statusEl.style.display = 'none';
  tableEl.style.display = 'table';
  allRows = rows;
  currentPage = 0;
  renderHistoryPage();
}, (error) => {
  console.error('[HISTORY] Failed to load game history:', error);
  statusEl.textContent = 'Failed to load history. Check console for details.';
});
</script>
</body>
</html>
