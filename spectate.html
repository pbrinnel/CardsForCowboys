<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectating - Cards For Cowboys</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #e9e0c6;
      color: #1e1610;
      min-height: 100vh;
    }

    /* ── Header ── */
    #spec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1610;
      color: #e9e0c6;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border-bottom: 2.5px solid #1e1610;
    }
    #spec-header .code-badge {
      background: #b87838;
      color: #1e1610;
      padding: 0.15rem 0.5rem;
      letter-spacing: 2px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 0.5rem;
    }
    #spec-phase { color: #d49848; font-style: italic; }

    /* ── Layout ── */
    #spec-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* ── Loading / Error ── */
    #spec-loading {
      text-align: center;
      padding: 3rem;
      color: #3a2a1a;
      font-style: italic;
    }

    /* ── Players grid ── */
    #spec-players {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .spec-player {
      background: #e9e0c6;
      border: 2px solid #1e1610;
      box-shadow: 2px 2px 0 #1e1610;
      padding: 0.6rem 0.8rem;
      flex: 1 1 180px;
      min-width: 160px;
    }
    .spec-player.active-buyer { border-color: #b87838; box-shadow: 2px 2px 0 #b87838; }
    .spec-player.busted { opacity: 0.6; }
    .spec-player-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #1e1610;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .spec-player-name .ai-badge {
      font-size: 0.65rem;
      background: rgba(26,122,150,0.15);
      color: #1a7a96;
      padding: 0.1rem 0.35rem;
      font-style: italic;
    }
    .spec-herd {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2a6e1a;
      margin-bottom: 0.25rem;
    }
    .spec-round-stats {
      font-size: 0.75rem;
      color: #3a2a1a;
      margin-bottom: 0.4rem;
      display: flex;
      gap: 0.6rem;
    }
    .spec-status {
      font-size: 0.7rem;
      font-style: italic;
      color: #c84e18;
      margin-bottom: 0.4rem;
    }

    /* ── Card rendering ── */
    .spec-hand { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 0.35rem; }
    .spec-card {
      width: 42px;
      height: 59px;
      overflow: hidden;
      border: 1px solid rgba(30,22,16,0.4);
      flex-shrink: 0;
    }
    .spec-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .spec-deck-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.3rem;
      font-size: 0.7rem;
      color: #b87838;
    }
    .spec-deck-backs { display: flex; flex-wrap: wrap; gap: 2px; }
    .spec-deck-back {
      width: 18px;
      height: 25px;
      overflow: hidden;
      border: 1px solid rgba(30,22,16,0.4);
    }
    .spec-deck-back img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Pyramid ── */
    #spec-pyramid-zone {
      background: #1e1610;
      border: 2.5px solid #1e1610;
      padding: 0.75rem;
      margin-bottom: 1rem;
    }
    #spec-pyramid-zone .zone-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b87838;
      margin-bottom: 0.5rem;
    }
    .spec-pyramid-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .spec-pyr-slot {
      width: 55px;
      height: 77px;
    }
    .spec-pyr-card {
      width: 55px;
      height: 77px;
      overflow: hidden;
      border: 1px solid rgba(30,22,16,0.5);
      position: relative;
    }
    .spec-pyr-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .spec-pyr-card .cost-label {
      position: absolute;
      bottom: 3px;
      left: 3px;
      background: rgba(30,22,16,0.82);
      color: #d49848;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 0.55rem;
      padding: 1px 3px;
    }
    .spec-pyr-card.face-down { opacity: 0.7; }

    /* ── Status bar ── */
    #spec-status-bar {
      background: #3a2a1a;
      color: #e9e0c6;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border: 2px solid #1e1610;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* ── Hover zoom preview ── */
    #spec-hover-preview {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      box-shadow: 4px 4px 0 #1e1610;
    }
    #spec-hover-preview.hidden { display: none; }
    #spec-hover-preview img { width: 180px; display: block; }

    /* ── Showdown view ── */
    #spec-showdown { display: none; margin-bottom: 1rem; }
    #spec-showdown.active { display: block; }
    .showdown-header {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      text-align: center;
      font-size: 1.4rem;
      color: #1e1610;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .showdown-player-block {
      background: #e9e0c6;
      border: 2px solid #1e1610;
      box-shadow: 2px 2px 0 #1e1610;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .showdown-player-block.winner { border-color: #b87838; box-shadow: 2px 2px 0 #b87838; }
    .showdown-player-block .sdp-name {
      font-size: 1rem;
      font-weight: bold;
      color: #1e1610;
      margin-bottom: 0.15rem;
    }
    .showdown-player-block .sdp-herd {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2a6e1a;
      margin-bottom: 0.3rem;
    }
    .showdown-player-block .sdp-tally {
      font-size: 0.78rem;
      color: #b87838;
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .showdown-card-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .showdown-card {
      width: 55px;
      height: 77px;
      overflow: hidden;
      border: 1px solid rgba(30,22,16,0.4);
      flex-shrink: 0;
      cursor: pointer;
    }
    .showdown-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .spec-card { width: 34px; height: 48px; }
      .spec-pyr-slot, .spec-pyr-card { width: 42px; height: 59px; }
      .showdown-card { width: 42px; height: 59px; }
    }
  </style>
</head>
<body>

<div id="spec-hover-preview" class="hidden"><img id="spec-hover-img" src="" alt=""></div>

<div id="spec-header">
  <div>
    Cards For Cowboys
    <span class="code-badge" id="spec-code">------</span>
    <span style="margin-left:0.75rem" id="spec-actround"></span>
  </div>
  <div id="spec-phase">Connecting…</div>
</div>

<div id="spec-main">
  <div id="spec-loading">Waiting for game data…</div>

  <div id="spec-game" style="display:none">
    <div id="spec-status-bar">Spectating</div>
    <div id="spec-showdown"></div>
    <div id="spec-players"></div>
    <div id="spec-pyramid-zone">
      <div class="zone-label">Store Pyramid</div>
      <div id="spec-pyramid"></div>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const CARD_IMG   = 'assets/cards/All-Cards/';
const BACK_IMG   = 'assets/backs/';
const CACTI_BACK = { 1: 'Blue Inline-01.jpg', 2: 'Yellow Inline-01.jpg', 3: 'Red Inline-01.jpg' };

const params = new URLSearchParams(location.search);
const code   = params.get('code');
const isAI   = params.get('ai') === '1';

if (!code) {
  document.getElementById('spec-loading').textContent = 'No game code in URL. Use a spectator link.';
} else {
  document.getElementById('spec-code').textContent = code;
  startSpectating(code, isAI);
}

function cardImgSrc(card, faceUp) {
  if (faceUp) return CARD_IMG + card.img;
  return BACK_IMG + (CACTI_BACK[card.cacti] || CACTI_BACK[1]);
}

const hoverPreview = document.getElementById('spec-hover-preview');
const hoverImg     = document.getElementById('spec-hover-img');

function showHover(el, src) {
  hoverImg.src = src;
  const rect = el.getBoundingClientRect();
  const pw = 180, ph = 252;
  let left = rect.right + 10;
  let top  = rect.top;
  if (left + pw > window.innerWidth)  left = rect.left - pw - 10;
  if (top  + ph > window.innerHeight) top  = window.innerHeight - ph - 8;
  hoverPreview.style.left = left + 'px';
  hoverPreview.style.top  = top  + 'px';
  hoverPreview.classList.remove('hidden');
}

function hideHover() {
  hoverPreview.classList.add('hidden');
}

function makeCardEl(card, faceUp, w, h) {
  const div = document.createElement('div');
  div.className = faceUp ? 'spec-card' : 'spec-card face-down';
  div.style.width = w + 'px'; div.style.height = h + 'px';
  const img = document.createElement('img');
  img.src = cardImgSrc(card, faceUp);
  img.alt = faceUp ? card.id : 'card back';
  div.appendChild(img);
  if (faceUp) {
    div.addEventListener('mouseenter', () => showHover(div, CARD_IMG + card.img));
    div.addEventListener('mouseleave', hideHover);
  }
  return div;
}

function phaseLabel(s) {
  const labels = { draw: 'Draw Phase', buy: 'Buy Phase', score: 'Scoring', showdown: 'Showdown!', gameOver: 'Game Over' };
  return labels[s] || s || '';
}

function cardImgFromId(cardId) {
  return CARD_IMG + 'Cards_' + cardId.split('_')[1] + '.jpg';
}

function renderShowdown(state) {
  const el = document.getElementById('spec-showdown');
  el.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'showdown-header';
  header.textContent = state.phase === 'showdown' ? 'Showdown' : 'Final Showdown';
  el.appendChild(header);

  const maxHerd = Math.max(...state.players.map(p => p.herd));

  state.players.forEach((p, i) => {
    const tally = state.showdownTallies ? state.showdownTallies[i] : null;
    const allCards = [...(p.deck || []), ...(p.hand || []), ...(p.discard || [])];

    const block = document.createElement('div');
    block.className = 'showdown-player-block' + (p.herd === maxHerd ? ' winner' : '');

    const nameEl = document.createElement('div');
    nameEl.className = 'sdp-name';
    nameEl.textContent = p.name + (p.herd === maxHerd ? ' — Winner' : '');
    block.appendChild(nameEl);

    const herdEl = document.createElement('div');
    herdEl.className = 'sdp-herd';
    herdEl.textContent = `🐄 ${p.herd}`;
    block.appendChild(herdEl);

    if (tally) {
      const tallyEl = document.createElement('div');
      tallyEl.className = 'sdp-tally';
      const parts = [];
      if (tally.totalCows !== 0) parts.push(`${tally.totalCows > 0 ? '+' : ''}${tally.totalCows} cows from cards`);
      if (tally.bonusCows > 0) parts.push(`+${tally.bonusCows} bonus ($${tally.totalDollars})`);
      const formula = parts.length ? parts.join(' + ') : 'No scoring cards';
      tallyEl.textContent = `${formula} = ${tally.gained >= 0 ? '+' : ''}${tally.gained} from showdown`;
      block.appendChild(tallyEl);
    }

    const grid = document.createElement('div');
    grid.className = 'showdown-card-grid';
    allCards.forEach(card => {
      if (!card || !card.id) return;
      const cardDiv = document.createElement('div');
      cardDiv.className = 'showdown-card';
      const img = document.createElement('img');
      img.src = cardImgFromId(card.id);
      img.alt = card.id;
      cardDiv.appendChild(img);
      cardDiv.addEventListener('mouseenter', () => showHover(cardDiv, cardImgFromId(card.id)));
      cardDiv.addEventListener('mouseleave', hideHover);
      grid.appendChild(cardDiv);
    });
    block.appendChild(grid);

    el.appendChild(block);
  });

  el.classList.add('active');
}

function startSpectating(gameCode, isAI) {
  // AI games write to liveGames/{code}; MP games write to games/{code}
  const basePath = isAI ? `liveGames/${gameCode}` : `games/${gameCode}`;
  const stateRef = ref(db, `${basePath}/spectatorState`);

  onValue(stateRef, (snap) => {
    const state = snap.val();
    if (!state) {
      document.getElementById('spec-loading').textContent =
        'Waiting for game to start… (spectator data will appear once the first round begins)';
      return;
    }

    document.getElementById('spec-loading').style.display = 'none';
    document.getElementById('spec-game').style.display = 'block';

    renderSpectatorState(state);
  });
}

function renderSpectatorState(state) {
  // Header
  document.getElementById('spec-actround').textContent =
    `Act ${state.act} · Round ${state.round}`;
  document.getElementById('spec-phase').textContent = phaseLabel(state.phase);

  // Status bar
  const statusEl = document.getElementById('spec-status-bar');
  if (state.phase === 'buy' && state.buyOrder && state.buyOrder.length > 0) {
    const idx = state.currentBuyerIdx;
    if (idx < state.buyOrder.length) {
      const buyerName = state.players[state.buyOrder[idx]]?.name || '?';
      statusEl.textContent = `Buy Phase — ${buyerName}'s turn`;
    } else {
      statusEl.textContent = 'Buy Phase — Scoring…';
    }
  } else if (state.phase === 'draw') {
    statusEl.textContent = 'Draw Phase — players are drawing cards';
  } else if (state.phase === 'showdown') {
    statusEl.textContent = 'Showdown! Final deck scores being tallied…';
  } else if (state.phase === 'gameOver') {
    const maxHerd = Math.max(...state.players.map(p => p.herd));
    const winners = state.players.filter(p => p.herd === maxHerd).map(p => p.name);
    statusEl.textContent = winners.length === 1
      ? `Game Over — ${winners[0]} wins with ${maxHerd} cows!`
      : `Game Over — Tie! (${winners.join(' & ')})`;
  } else {
    statusEl.textContent = phaseLabel(state.phase);
  }

  const isShowdownPhase = state.phase === 'showdown' || state.phase === 'gameOver';
  document.getElementById('spec-showdown').classList.toggle('active', false); // reset
  document.getElementById('spec-players').style.display = isShowdownPhase ? 'none' : '';
  document.getElementById('spec-pyramid-zone').style.display = isShowdownPhase ? 'none' : '';

  if (isShowdownPhase) {
    renderShowdown(state);
  } else {
    renderPlayers(state);
    renderPyramid(state);
  }
}

function renderPlayers(state) {
  const container = document.getElementById('spec-players');
  container.innerHTML = '';

  const activeBuyerIdx = state.phase === 'buy' &&
    state.buyOrder && state.currentBuyerIdx < state.buyOrder.length
    ? state.buyOrder[state.currentBuyerIdx] : -1;

  state.players.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'spec-player'
      + (i === activeBuyerIdx ? ' active-buyer' : '')
      + (p.busted ? ' busted' : '');

    // Name row
    const nameRow = document.createElement('div');
    nameRow.className = 'spec-player-name';
    nameRow.textContent = p.name;
    if (!p.isHuman) {
      const badge = document.createElement('span');
      badge.className = 'ai-badge';
      badge.textContent = 'AI';
      nameRow.appendChild(badge);
    }
    div.appendChild(nameRow);

    // Herd score
    const herd = document.createElement('div');
    herd.className = 'spec-herd';
    herd.textContent = `🐄 ${p.herd}`;
    div.appendChild(herd);

    // Round stats (only meaningful during draw/buy phases)
    if (state.phase === 'draw' || state.phase === 'buy') {
      const stats = document.createElement('div');
      stats.className = 'spec-round-stats';
      stats.innerHTML = `<span>$${p.roundDollars}</span><span>🐄 ${p.roundCows}</span><span>B ${p.roundBandits}</span>`;
      div.appendChild(stats);
    }

    // Status flags
    if (p.busted) {
      const s = document.createElement('div');
      s.className = 'spec-status';
      s.textContent = 'BUSTED';
      div.appendChild(s);
    } else if (p.stoppedDrawing && state.phase === 'draw') {
      const s = document.createElement('div');
      s.className = 'spec-status';
      s.style.color = '#1f7a1f';
      s.textContent = 'Stopped drawing';
      div.appendChild(s);
    }

    // Hand (face-up — spectators see everything)
    if (p.hand && p.hand.length > 0) {
      const handLabel = document.createElement('div');
      handLabel.style.cssText = 'font-size:0.65rem;color:#8b6914;margin-top:0.3rem;margin-bottom:2px';
      handLabel.textContent = `Hand (${p.hand.length})`;
      div.appendChild(handLabel);

      const handRow = document.createElement('div');
      handRow.className = 'spec-hand';
      p.hand.forEach(card => {
        if (!card) return;
        handRow.appendChild(makeCardEl(card, true, 42, 59));
      });
      div.appendChild(handRow);
    }

    // Deck (backs only, showing count and first few backs)
    if (p.deck && p.deck.length > 0) {
      const deckRow = document.createElement('div');
      deckRow.className = 'spec-deck-row';
      const deckLabel = document.createElement('span');
      deckLabel.textContent = `Deck (${p.deck.length}):`;
      deckRow.appendChild(deckLabel);

      const backs = document.createElement('div');
      backs.className = 'spec-deck-backs';
      // Show up to 10 backs to avoid overflow
      p.deck.slice(0, 10).forEach(c => {
        if (!c) return;
        const slot = document.createElement('div');
        slot.className = 'spec-deck-back';
        const img = document.createElement('img');
        img.src = BACK_IMG + (CACTI_BACK[c.cacti] || CACTI_BACK[1]);
        img.alt = 'deck card';
        slot.appendChild(img);
        backs.appendChild(slot);
      });
      if (p.deck.length > 10) {
        const more = document.createElement('span');
        more.style.cssText = 'font-size:0.65rem;color:#8b6914;align-self:center';
        more.textContent = `+${p.deck.length - 10}`;
        backs.appendChild(more);
      }
      deckRow.appendChild(backs);
      div.appendChild(deckRow);
    }

    container.appendChild(div);
  });
}

function renderPyramid(state) {
  const container = document.getElementById('spec-pyramid');
  container.innerHTML = '';

  if (!state.pyramid || state.pyramid.length === 0) return;

  state.pyramid.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'spec-pyramid-row';

    row.forEach(slot => {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'spec-pyr-slot';

      if (!slot.removed) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'spec-pyr-card' + (slot.faceUp ? '' : ' face-down');

        const img = document.createElement('img');
        img.src = slot.faceUp
          ? CARD_IMG + slot.card.img
          : BACK_IMG + (CACTI_BACK[slot.card.cacti] || CACTI_BACK[1]);
        img.alt = slot.faceUp ? slot.card.id : 'card back';
        cardDiv.appendChild(img);
        if (slot.faceUp) {
          cardDiv.addEventListener('mouseenter', () => showHover(cardDiv, CARD_IMG + slot.card.img));
          cardDiv.addEventListener('mouseleave', hideHover);
        }

        if (slot.faceUp && slot.card.cost) {
          const cost = document.createElement('span');
          cost.className = 'cost-label';
          cost.textContent = '$' + slot.card.cost;
          cardDiv.appendChild(cost);
        }

        slotDiv.appendChild(cardDiv);
      }

      rowDiv.appendChild(slotDiv);
    });

    container.appendChild(rowDiv);
  });
}
</script>
</body>
</html>
